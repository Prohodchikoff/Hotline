services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: hotline-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DBNAME}
      POSTGRES_USER: ${DBUSER}
      POSTGRES_PASSWORD: ${DBPASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - hotline-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotline_user -d hotline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hotline-pgdata: